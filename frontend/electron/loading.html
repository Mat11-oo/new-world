<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New World</title>
  <style>
    html, body { height: 100%; margin: 0; background: #08080a; color: #f4f1ea; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
    body { display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; }
    .cover { display: flex; flex-direction: column; align-items: center; gap: 18px; animation: fade 600ms ease both; }
    .mark { position: relative; width: 58px; height: 58px; border: 1px solid rgba(247,244,236,.16); border-radius: 16px; display: grid; place-items: center; background: rgba(255,255,255,.025); }
    .mark::before { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(247,244,236,.1); border-radius: 11px; }
    .planet { width: 17px; height: 17px; border-radius: 50%; background: #f4f1ea; box-shadow: 0 0 22px rgba(244,241,234,.35); }
    .orbit { position: absolute; width: 34px; height: 11px; border: 1px solid rgba(244,241,234,.6); border-radius: 50%; transform: rotate(-24deg); }
    .brand { font-family: Georgia, "Times New Roman", serif; font-size: 25px; letter-spacing: .12em; }
    .status { font-size: 9px; letter-spacing: .24em; color: rgba(245,242,234,.4); }
    .bar { width: 180px; height: 1px; background: rgba(247,244,236,.09); overflow: hidden; }
    .bar::after { content: ""; display: block; width: 42%; height: 100%; background: linear-gradient(90deg, transparent, rgba(247,244,236,.7), transparent); animation: scan 1.6s ease-in-out infinite; }
    @keyframes scan { from { transform: translateX(-120%); } to { transform: translateX(360%); } }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <div class="cover">
    <div class="mark"><span class="orbit"></span><span class="planet"></span></div>
    <div class="brand">New World</div>
    <div class="status">STARTING AI FILM STUDIO</div>
    <div class="bar"></div>
  </div>
</body>
</html>
